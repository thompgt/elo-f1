[project]
name = "elo-f1"
version = "0.1.0"
description = "Driving-quality Elo ratings for F1 drivers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastf1>=3.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = ["jupyter>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
